<app-bloc-style-component (click)="navigateToDetails()"
  class="block cursor-pointer transition-transform duration-200 ease-out will-change-transform hover:scale-105">
  <h3 class="text-2xl font-bold text-primary text-center">{{ pokemon().name | titlecase }}</h3>
  <img class="mt-4" [src]="pokemon().imageUrl" [alt]="pokemon().name" />
</app-bloc-style-component>
